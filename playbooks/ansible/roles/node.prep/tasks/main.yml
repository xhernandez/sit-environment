---
- name: Process OS specific tasks
  include_tasks: "{{ include_file }}"
  with_first_found:
    - files: "{{ config.os[site.os].includes }}"
  loop_control:
    loop_var: include_file

- name: Process backend specific tasks (server)
  include_role:
    name: 'sit.{{ config.be.name }}'
    tasks_from: server/main.yml

- name: Configura DNS for AD
  when: config.groups['ad'] is defined
  lineinfile:
    path: /etc/resolv.conf
    regex: "^nameserver"
    line: "nameserver {{ config.nodes[config.groups['ad'][0]].networks.public }}"
    state: present
